[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-provider-forecast"
version = "0.1.0"
description = "Native DEV point forecasting provider for M5PHET"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
native = ["tensorflow==2.21.0"]
export = ["tensorflow==2.21.0", "pandas>=2"]
test = ["pytest>=8"]

[project.entry-points."m5phet.providers"]
predictor_forecast = "prediction_provider_forecast:ForecastProvider"

[project.scripts]
m5phet-forecast = "prediction_provider_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
